services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_chatbot
      POSTGRES_PASSWORD: rag_chatbot
      POSTGRES_DB: rag_chatbot
    ports:
      - "5433:5432"
    volumes:
      - rag_chatbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_chatbot -d rag_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_chatbot_postgres_data:
